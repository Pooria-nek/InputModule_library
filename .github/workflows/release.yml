
name: Release Library

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: Pooria-nek/github-actions/.github/workflows/platformio-release.yml@main
    secrets:
      PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
